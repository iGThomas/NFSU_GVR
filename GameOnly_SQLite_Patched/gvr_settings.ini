; ==========================================================================
;  NFS Underground - GlobalVR (portable V3)          gvr_settings.ini
; --------------------------------------------------------------------------
;  Edit the values below, then run:
;
;      Tools\Apply-GvrSettings.ps1
;
;  Changes are applied by rewriting the resolution constants inside the two
;  executables (neither has any config/registry setting for this). A pristine
;  copy of each is kept as <name>.exe.orig, and every run re-patches from that
;  backup - so you can change these values as often as you like, and setting a
;  value back to 800x600 restores the untouched original.
; ==========================================================================

[Race]
; Fullscreen resolution for the actual driving (UndergroundGVR.exe).
;
; Any resolution your GPU supports works. The trade-off:
;
;   4:3  (1280x960, 1600x1200)  - ORIGINAL camera framing, pillarboxed on a
;                                 widescreen monitor. Sharp and geometrically
;                                 correct. Recommended.
;   16:9 (1920x1080)            - fills the screen and is the sharpest option,
;                                 but the engine uses a FIXED HORIZONTAL FOV
;                                 and derives the vertical from the aspect, so
;                                 the top and bottom get cropped and the view
;                                 looks slightly zoomed in. Not a bug in the
;                                 install - it is how the 2003 engine works.
;
;   800x600                     - stock arcade cabinet setting.
Width=1280
Height=960

[Shell]
; Window size for the frontend / attract mode (UniverShell2.exe).
; This is a borderless window, so it is not limited to real display modes.
; The cabinet ran the desktop at 800x600 so this window filled the screen;
; on a modern desktop 800x600 just sits in the top-left corner.
;
; 4:3 sizes keep the menu artwork in its correct proportions.
; 1440x1080 is the largest 4:3 window that fits a 1080p screen.
Width=1440
Height=1080
