; ==========================================================================
;  NFS Underground - GlobalVR (portable V3)          gvr_settings.ini
; --------------------------------------------------------------------------
;  EDIT THIS FILE, THEN JUST START THE GAME - nothing else to run.
;  Launch with GvrLaunch.exe (in the install root) and every setting below is
;  applied automatically at startup. The two executables are NEVER modified.
;
;  [Display]    - one size for BOTH programs: the frontend (UniverShell2.exe)
;                 and the driving (UndergroundGVR.exe). Sharing one value is
;                 what makes the hand-over between them seamless.
;                 Applied by GvrLaunch.exe and GVRInputRaw.dll.
;  [Controller] - gamepad map for a race, applied by GVRInputRaw.dll.
;  [Frontend]   - gamepad map for the menus (same DLL; the card button is
;                 read by CardEmu\GvrCardKey.exe).
;  [Launcher]   - GvrLaunch.exe behaviour.
; ==========================================================================

[Display]
; ---- Resolution -------------------------------------------------------
; Used by the frontend AND the race. The installer sets this to the largest
; 4:3 size that fits your primary screen; edit it freely afterwards.
;
;   4:3  (1280x960, 1440x1080, 1600x1200)
;        ORIGINAL camera framing, pillarboxed on a widescreen monitor.
;        Sharp and geometrically correct. Recommended.
;   16:9 (1920x1080)
;        fills the screen and is the sharpest option, but the engine uses a
;        FIXED HORIZONTAL FOV and derives the vertical from the aspect, so
;        the top and bottom get cropped and the view looks slightly zoomed
;        in. Not a bug in the install - it is how the 2003 engine works.
;   800x600
;        stock arcade cabinet setting.
Width=1280
Height=960

; ---- Fullscreen or windowed -------------------------------------------
; false = DEFAULT. Both programs run in a borderless window: they still
;         cover the taskbar while they are the active window, but you can
;         alt-tab away and your desktop resolution never changes.
; true  = the race takes over the screen (how the cabinet ran it).
;
; This chooses the -forcefullscreen / -forcewindowed launch switch the shell
; passes to the game, applied by GvrLaunch.exe at startup.
;
; NOTE: in FULLSCREEN the Width/Height above must be a resolution your
; monitor actually supports, otherwise Direct3D cannot create the device.
; (An unsupported size is auto-corrected to the nearest supported one, so
; the race no longer crashes - see the log if a size gets substituted.)
; In WINDOWED mode any size is allowed.
Fullscreen=false

; Windowed only: drop the title bar and frame for a clean "borderless window"
; at exactly the size above, centred on screen. Set false if you would rather
; have a normal title bar to drag the window around with.
Borderless=true

; ==========================================================================
;  Gamepad button map - Xbox (XInput) and PS4/DS4 (raw HID, USB or Bluetooth).
;  Read at startup: edit and relaunch, no tool to run. EVERY pad button the
;  install uses is listed below - nothing is hardcoded.
;
;  Button names (both sections):
;      cross circle square triangle  l1 r1 l2 r2  options share  l3 r3
;      dup ddown dleft dright  ps
;
;  The map is POSITIONAL, so an Xbox pad works with no edit at all - and you
;  may write either name, they are the same button:
;      a=cross (bottom)   b=circle (right)   x=square (left)   y=triangle (top)
;      lb=l1  rb=r1   lt=l2  rt=r2   start/menu=options   back/view=share
;      ls=l3  rs=r3   guide=ps (DS4 only - XInput does not report the Guide)
;
;  A button you do not list keeps its default; `= none` unbinds it.
;  One button may carry SEVERAL actions, comma separated - the game is in only
;  one state at a time, so e.g. Cross is the e-brake while driving and also the
;  button that answers the quit prompt.
;
;  NOT remappable: steering is always the left stick, and in a race the
;  triggers are always throttle (R2/RT) and brake (L2/LT).
;  The keyboard keeps working alongside the pad in both programs.
; ==========================================================================

[Controller]
; ---- in a race (UndergroundGVR.exe) -----------------------------------
;   actions: ebrake nitrous lookback start music camera shiftup shiftdown
;            quit       - opens the game's own QUIT GAME? prompt
;            confirm    - answers that prompt (the pad's equivalent of S)
;            skipintro  - skips the fly-by animation at the start of a race
;            none
Cross    = ebrake, confirm, skipintro
Circle   = nitrous
L1       = lookback
Options  = start
Square   = shiftup
Triangle = shiftdown
R1       = camera
DRight   = music
DDown    = quit

[Frontend]
; ---- in the menus / attract mode (UniverShell2.exe) --------------------
; These are the arcade cabinet's own keys, so each action is named after the
; key it stands in for:
;   select    - 'S'   confirm / start / swipe the card
;   exit      - 'E'   back / exit to the main screen
;   operator  - 'O'   opens the operator menu
;   navup navdown navleft navright   - the arrow keys (menu + operator menu)
;   accept    - accept a letter in the career name-entry screens (= navright)
;   backspace - delete a letter there                            (= navleft)
;   card      - insert the card, or eject it if one is already in
;               (handled by CardEmu\GvrCardKey.exe, hence its own action)
;   none
; Menu selection also follows the left stick like a wheel, as on the cabinet.
Cross    = select
Circle   = exit
Options  = operator
DUp      = navup
DDown    = navdown
DLeft    = navleft
DRight   = navright
R2       = accept
L2       = backspace
R3       = card

[Launcher]
; Show a full-screen backdrop behind the frontend and the race so you never
; see the Windows desktop when one program hands over to the other. It sits
; BEHIND both programs (it never takes focus or re-parents them) and paints
; the last frame while they swap.
Backdrop=true
